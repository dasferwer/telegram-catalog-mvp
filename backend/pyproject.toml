[project]
name = "telegram-catalog"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.135,<1", "uvicorn>=0.41,<1", "sqlalchemy[asyncio]>=2.0.48,<2.1",
  "asyncpg>=0.31,<1", "alembic>=1.18,<2", "aiogram>=3.31,<4",
  "boto3>=1.42,<2", "pydantic-settings>=2.12,<3", "pillow>=13.0,<14",
]
[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "httpx>=0.28,<1", "ruff>=0.15,<1", "mypy>=1.19,<2", "boto3-stubs[s3]>=1.42,<2"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
