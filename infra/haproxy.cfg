global
    log stdout format raw local0
    maxconn 256
    stats socket ipv4@127.0.0.1:9999 level admin

defaults
    mode http
    log global
    option httplog
    timeout connect 3s
    timeout client 50s
    timeout server 50s
    timeout http-request 8s
    timeout http-keep-alive 5s
    default-server inter 2s fall 2 rise 1

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 2s
    hold obsolete 2s

frontend ingress
    bind :8080
    acl api path_beg /api/
    acl webhook path /telegram/webhook
    http-response set-header X-Upstream %[srv_name]
    use_backend api_pool if api
    use_backend bot_pool if webhook
    default_backend web_pool

backend api_pool
    balance roundrobin
    option httpchk GET /health/ready
    server-template api 1-8 api:8000 check resolvers docker init-addr none resolve-prefer ipv4

backend bot_pool
    balance roundrobin
    option httpchk GET /health/ready
    server-template bot 1-8 bot:8001 check resolvers docker init-addr none resolve-prefer ipv4

backend web_pool
    balance roundrobin
    option httpchk GET /health
    server-template web 1-8 web:3000 check resolvers docker init-addr none resolve-prefer ipv4
